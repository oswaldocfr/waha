services:
  waha:
    restart: always
    image: devlikeapro/waha:latest

    dns:
      - 1.1.1.1
      - 8.8.8.8

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    ports:
      - '3000:3000'

    volumes:
      - 'waha_sessions:/app/.sessions'
      - 'waha_media:/app/.media'

    env_file:
      - .env

volumes:
  waha_sessions: {}
  waha_media: {}
